<!DOCTYPE html>
<html>
<head>
    <title>SecureBox Login</title>
    

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        div {
            background-color: royalblue;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: white;
        }

        p {
            color: white;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            background-color: skyblue;
            padding: 12px;
            width: 95%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div>

        <h1>SecureBox</h1>

        <p>Your passwords, protected.</p>

        <form>

            <input type="email"
            placeholder="example@securebox.com"
            required>

            <br>

            <input type="password"
            placeholder="Enter password"
            required>

            <br><br>

            <button type="submit">Login</button>

        </form>

        <br>

       

    </div>

</body>
</html>
