<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #49dce1;
        }

        h1 {
            color: #a417ab;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
            width: 200px;
        }

        button {
            margin-right: 10px;
            padding: 5px 10px;
        }

        #balance, #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account</title>
</head>
<body>
    <h1>Bank Account</h1>
    <p id="balance" aria-live="polite"></p>

    <label for="amount">Amount:</label>
    <input id="amount" type="number" min="0.01" step="0.01" required>
    <button id="deposit" type="button">Deposit</button>
    <button id="withdraw" type="button">Withdraw</button>
    <button id="check-balance" type="button">Check balance</button>
    <p id="message" aria-live="polite"></p>

    <script>
        class BankAccount {
            #balance;

            constructor(initialBalance) {
                if (!Number.isFinite(initialBalance) || initialBalance < 0) {
                    throw new Error("Initial balance must be a non-negative number.");
                }
                this.#balance = initialBalance;
            }

            deposit(amount) {
                this.#validateAmount(amount);
                this.#balance += amount;
            }

            withdraw(amount) {
                this.#validateAmount(amount);
                if (amount > this.#balance) {
                    throw new Error("Insufficient funds.");
                }
                this.#balance -= amount;
            }

            getBalance() {
                return this.#balance;
            }

            #validateAmount(amount) {
                if (!Number.isFinite(amount) || amount <= 0) {
                    throw new Error("Enter an amount greater than zero.");
                }
            }
        }

        const account = new BankAccount(1000);
        const amountInput = document.getElementById("amount");
        const balanceDisplay = document.getElementById("balance");
        const messageDisplay = document.getElementById("message");

        function showBalance() {
            balanceDisplay.textContent = `Current balance: ${account.getBalance().toFixed(2)}`;
        }

        function performTransaction(transaction, successMessage) {
            const amount = Number(amountInput.value);
            try {
                transaction(amount);
                messageDisplay.textContent = successMessage;
                showBalance();
            } catch (error) {
                messageDisplay.textContent = error.message;
            }
        }

        document.getElementById("deposit").addEventListener("click", () => {
            performTransaction((amount) => account.deposit(amount), "Deposit successful.");
        });

        document.getElementById("withdraw").addEventListener("click", () => {
            performTransaction((amount) => account.withdraw(amount), "Withdrawal successful.");
        });

        document.getElementById("check-balance").addEventListener("click", () => {
            showBalance();
            messageDisplay.textContent = "Balance checked.";
        });

        showBalance();
    </script>
</body>
</html>
