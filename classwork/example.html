<html>
    <head> 
        <title> Constructor </title>
    </head>
    <script>
        class Person {
            constructor(name, age) {
                this.name = name;
                this.age = age;
            }
            intro=function(){console.log("My name is "+this.name+" and my age is "+this.age);}
        }
        const s1=new Person("Parishith",18);
        s1.intro();
    </script>
</html>
